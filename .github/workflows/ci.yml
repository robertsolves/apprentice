# Builds and self-tests on every PR and every push to main. The build is the
# universal (arm64 + x86_64) release build that release.yml ships, so a broken
# release shows up on the PR instead of at tag time.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-selftest:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - run: swift --version

      - name: Build (universal, release)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Check the binary is universal
        run: |
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/apprentice"
          ARCHS="$(lipo -archs "$BIN")"
          echo "archs: $ARCHS"
          case "$ARCHS" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::not universal"; exit 1 ;; esac
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      # The built-in checks need no Accessibility or Screen Recording grant.
      # A throwaway HOME keeps them off the runner's own state.
      - name: Self-test
        run: HOME="$RUNNER_TEMP/home" "$BIN" selftest

      # The DMG release.yml ships, unsigned: a broken bundle shows up on the PR.
      - name: Package the DMG and check its app
        run: |
          scripts/make-dmg.sh "$BIN" "$RUNNER_TEMP/dist"
          APP="$RUNNER_TEMP/dist/Apprentice.app"
          for exe in "$APP/Contents/MacOS/apprentice" "$APP/Contents/Helpers/apprentice"; do
            case "$(lipo -archs "$exe")" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::$exe is not universal"; exit 1 ;; esac
          done
          VERSION="$(HOME="$RUNNER_TEMP/home" "$APP/Contents/Helpers/apprentice" version)"
          echo "bundled CLI: $VERSION"
          case "$VERSION" in *"(release)"*) ;; *) echo "::error::the bundled CLI does not know it is a release install"; exit 1 ;; esac
          test -f "$APP/Contents/Resources/share/agent/connect.py"
          test -d "$APP/Contents/Resources/share/playbooks"
          HOME="$RUNNER_TEMP/home" "$APP/Contents/Helpers/apprentice" playbooks --check

      - name: Check the scripts parse
        run: |
          for f in install.sh kit.sh scripts/*.sh $(git ls-files 'agent/*.sh'); do bash -n "$f"; done
          python3 -m py_compile $(git ls-files 'agent/*.py')
