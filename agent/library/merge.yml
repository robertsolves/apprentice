# Merges offered facts by key and publishes the library's site. An offer comes from a stranger's pull request, so this
# runs from pull_request_target with write access and must never run or check out anything from that pull request: its
# one allowed file is fetched through the API as data, and the tool reading it comes from apprentice's own repo.
name: Merge offered facts

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

# One at a time: two merges at once would race on main.
concurrency:
  group: library
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

env:
  # Set the repo variable APPRENTICE_REF to a commit to pin the tool that judges offers.
  APPRENTICE_REF: ${{ vars.APPRENTICE_REF || 'main' }}

jobs:
  library:
    runs-on: macos-15
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: The library, never the pull request's copy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: lib

      - name: The tool, from apprentice's repo
        uses: actions/checkout@v4
        with:
          repository: robertsolves/apprentice
          ref: ${{ env.APPRENTICE_REF }}
          path: tool

      - uses: actions/cache@v4
        with:
          path: tool/.build
          key: tool-${{ runner.os }}-${{ hashFiles('tool/Sources/**', 'tool/Package.swift') }}

      - name: Build the tool
        run: swift build -c release --package-path tool

      - name: Fetch the offer as data
        id: offer
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p incoming
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | [.status, .filename] | @tsv' > files.tsv
          # One new offers/<id>.jsonl and nothing else, or it is closed unread.
          if [ "$(wc -l < files.tsv)" -ne 1 ] || ! grep -qE '^added	offers/[A-Za-z0-9-]+\.jsonl$' files.tsv; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name=$(cut -f2 files.tsv)
          gh api -H 'Accept: application/vnd.github.raw' "repos/$REPO/contents/$name?ref=$HEAD_SHA" > "incoming/$(basename "$name")"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Merge by fact key
        if: steps.offer.outputs.ok == 'true'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          APPRENTICE_HOME: ${{ runner.temp }}/home
          PATH_TO_TOOL: tool/.build/release/apprentice
        run: |
          "$PATH_TO_TOOL" skills library merge lib --from incoming --by "$AUTHOR" | tee result.txt
          cd lib
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "apprentice-library"
            git config user.email "apprentice-library@users.noreply.github.com"
            git add -A
            git commit -q -m "Merge offered facts"
            git push -q origin HEAD
          fi

      - name: Close the pull request with the result
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OK: ${{ steps.offer.outputs.ok }}
        run: |
          if [ "$OK" = "true" ]; then body=$(cat result.txt); else body="Closed: a pull request here adds one offers/<id>.jsonl and changes nothing else. apprentice skills share --library makes one."; fi
          gh pr close "$PR" --repo "$REPO" --comment "$body"

      - name: Build the site
        env:
          APPRENTICE_HOME: ${{ runner.temp }}/home
        run: tool/.build/release/apprentice skills library publish lib --out _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
