# ~/.apprentice/routes.toml
# Extra faster-route entries, checked before screen control.

[[route]]
domain = "example.com"
label = "admin"
keywords = ["article", "publish", "draft"]
faster = "POST https://example.com/admin/api/articles"
remaining = "image upload and preview only"

# Site policies: your notes on a site's terms, for reference. apprentice never refuses a site.
# `apprentice policy <domain>` prints the entry; `checked` warns when it is over 6 months old.
#
# [policy."linkedin.com"]
# terms_url = "https://www.linkedin.com/help/linkedin/answer/a1341387"
# checked = "2026-11-01"
# api = "LinkedIn Marketing and Community Management APIs"
#
# [policy."x.com"]
# terms_url = "https://help.x.com/en/rules-and-policies/x-automation"
# checked = "2026-11-01"
# api = "X API"
