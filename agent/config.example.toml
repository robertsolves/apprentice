# ~/.deskkontrol/config.toml

[pace.default]
move_ms = [200, 900]
key_ms_median = 100
key_ms_sigma = 0.4
between_actions_ms = [500, 2000]
nav_min_gap_s = 5
reload_max = { count = 3, window_s = 120 }
actions_per_min = 30

# Every profile starts from pace.default; list only the keys that differ.
[pace."github.com"]
# actions_per_min = 20

[pace.native]
mode = "fast"

[session]
# Empty means unrestricted. Example: allow = ["github.com", "robertsolves.com"]
allow = []

[agent]
# false: the LLM may use quick shell commands for macOS tasks (files, folders, opening apps).
# true: everything goes through the UI. Websites always go through the UI.
# DESKKONTROL_UI_ONLY=1 sets it for one shell.
ui_only = false
# The first `session` after deskkontrol starts opens a little window asking for these options.
ask_on_start = true
# Sound when deskkontrol's little window pops up: a system sound name (Ping, Glass, Pop…) or "none".
ask_sound = "Ping"

[run]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key = ""
vision_model = ""
