# ~/.apprentice/config.toml

# Keystrokes keep a slight human rhythm. In native apps the cursor and the pause between actions do
# not wait. Built in, web pages run at the steady style and the social sites (Facebook, Instagram,
# Threads, TikTok, LinkedIn, X, Reddit, Pinterest, YouTube, Bluesky) at careful; [pace.styles] below wins.
[pace.default]
move_ms = [50, 200]
key_ms_median = 100
key_ms_sigma = 0.4
between_actions_ms = [0, 0]
nav_min_gap_s = 5
reload_max = { count = 3, window_s = 120 }
actions_per_min = 30
overshoot = 0.33   # share of long cursor moves that pass the target, then correct back
fidget = 0         # share of actions followed by a gesture that changes nothing (glance, trace, rest, scroll and back); at most 0.5
browse = 0         # share of commands on a web page that end with browse_s of reading down the feed, then back up; at most 0.2
browse_s = [10, 40]
# style = "fast"   # sets every timing key at once: "fastest", "fast" (native default), "steady" (web default), or "careful" (social default; slowest, least scripted)
# A person's day, set by careful; any profile can set or change them:
# quiet_hours = [2, 6]      # local hours with no actions on the site; [] turns them off
# session_max_min = 50      # a sitting on one site this long starts a break (0 is off)
# break_min = [15, 40]      # the break, in minutes
# actions_per_day = 400     # actions on one site in a day (0 is off)

# Styles per site or app in one place. "web" is every browser, "native" every other app.
# A [pace."<site>"] section below then starts from that site's style and lists only what differs.
[pace.styles]
careful = ["facebook.com", "instagram.com", "threads.net", "tiktok.com", "linkedin.com", "x.com", "reddit.com"]
# steady = ["news.ycombinator.com"]
# fast = ["web"]      # put web pages back on the fast style
# fastest = ["native"]

# Every profile starts from pace.default (or its style); list only the keys that differ.
[pace."github.com"]
# actions_per_min = 20

# Social sites: a person's pace. Reads a page before acting on it (dwell_s), rests after a few quick
# actions (burst, rest_s), moves and types at hand speed, keeps quiet hours and takes breaks.
# Budgets per action kind are in budgets.json. A profile covers its subdomains too (www.linkedin.com),
# and x.com covers twitter.com. They use the careful style above; these keys differ from it.
[pace."x.com"]
between_actions_ms = [2000, 8000]
dwell_s = [2, 6]
actions_per_min = 8

[pace."reddit.com"]
between_actions_ms = [2000, 8000]
dwell_s = [2, 6]
actions_per_min = 8
# browse = 0.1      # now and then read down the feed for a while, then scroll back (0.08 on social sites)

[pace."instagram.com"]
browse = 0.12       # a feed is mostly read
# quiet_hours = [1, 7]

[pace.native]
mode = "fast"   # shorter key gaps in native apps

# What apprentice does when a site pushes back. apprentice never refuses a site on its own; these
# decide. "stop" refuses actions on that site, "warn" lets work go on with a ⚠ line, "off" does not look.
[sites]
# A throttling message after an action ("try again later", "rate limit"…). Stopping is what keeps an
# account from a shadow ban: the cooldown lasts each of cooldown_hours in turn (the last one repeats).
on_soft_block = "stop"
cooldown_hours = [1, 6, 24]
# A CAPTCHA or "confirm it's you" check. apprentice never completes one in any mode; the user does.
on_challenge = "stop"
# Text that means the site is throttling, and signs of a check. These replace the built-in lists;
# matched lower case, no commas inside a phrase.
# The built-in lists cover English and the big sites' other languages.
# soft_block = ["try again later", "temporarily restricted", "unusual activity", "rate limit"]
# challenge = ["captcha", "verify you are human", "confirm it's you", "enter the code"]
# Or add to the built-in lists instead of replacing them:
# soft_block_extra = ["something your site says"]
# challenge_extra = []

# More words per budgeted kind, for a language or a site's own labels (whole words; CJK inside text).
# [sites.kinds]
# like = ["gostei"]
# follow = ["seguir perfil"]

[gate]
# Steps only the user can approve, in apprentice's window or menu-bar item; the agent's approve is
# refused, even inside an approved flow. Whole words in the button or link. Password fields always are.
# [] leaves every step to the agent.
user_only = ["pay", "pay now", "buy", "buy now", "purchase", "checkout", "check out", "place order", "order now", "donate", "transfer", "upgrade", "captcha", "not a robot", "verify you are human", "delete account", "close account", "deactivate"]

[session]
# Sites this session may use. Empty: any site, and the agent goes only where the task needs.
# Example: allow = ["github.com", "example.com"]
allow = []

[agent]
# false: the LLM may use quick shell commands for macOS tasks (files, folders, opening apps).
# true: everything goes through the UI. Websites always go through the UI.
# APPRENTICE_UI_ONLY=1 sets it for one shell.
ui_only = false
# true: the first `session` after apprentice starts opens a little window asking for these options.
ask_on_start = false
# Sound when apprentice's little window pops up: a system sound name (Ping, Glass, Pop…) or "none".
ask_sound = "Ping"
# Keep the display and system from idle sleep and locking while a task runs, and 2 min after (`apprentice awake on|off`).
keep_awake = false
# The menu-bar item: α idle, α … working, α ? waiting for you, α ! a step needs approval (its menu approves or denies it).
menu_bar = true
# A small always-on-top box: working, handed to you while you move, paused. Close asks, then stops apprentice.
overlay = true
# A short system sound for each thing that happens (a command, a hand-off to you, a pause, a failure).
sounds = true
# Desktop notifications (with the apprentice icon) when it needs a question or an approval answered. Off by default;
# the phone push (`notify`, an ntfy topic) is also off until `apprentice phone on` sets it.
notifications = false
# The apprentice icon in the Dock while it runs (the menu-bar icon is always there unless menu_bar = false).
dock_icon = true
# Where questions go. "both": the little window first, and if nobody answers within ask_window_s the
# agent asks in the chat (terminal), so the user can answer remotely. "window" or "terminal" for one only.
# `apprentice away on` switches to the terminal until `apprentice away off`.
ask_in = "both"
ask_window_s = 60
# A push to your phone when a question goes to the chat: an ntfy topic URL (install the ntfy app and
# subscribe to the same topic). Pick a long random topic name: anyone who knows it can read the pushes.
# Only the question text is sent, never a screenshot; a scrubbed app's question is sent as "a question is waiting".
# notify = "https://ntfy.sh/apprentice-<long random string>"
# Apps that open https links count as browsers. Add bundle ids here for any that do not register.
# browsers = ["com.example.Browser"]
# Context-menu items `download` uses, matched lower case. Add your language's if the Mac is not in English.
# download_menu = ["save image as", "download linked file", "save link as", "download image"]

[run]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key = ""
vision_model = ""

# A small Linux VM (Tart, about 2 GB) that runs Chromium, so browser work never borrows your cursor
# and keyboard. install.sh makes it (`apprentice vm setup`); `apprentice vm on` / `off` switches it.
# [vm]
# name = "apprentice-browser"
# cpu = 2
# memory_mb = 2048
# password = "admin"            # the image's login, used once; `vm setup` gives a Tart VM its own
# home = "/Volumes/SSD/tart"    # keep the VM on another disk
# local = ["linkedin.com"]       # sites whose accounts stay on this Mac's own browser, never in a VM
# host = "203.0.113.7"          # a Debian server elsewhere (a cloud VM) instead of Tart; user needs passwordless sudo
# port = 22
#
# More VMs, one per agent session: `APPRENTICE_VM=linkedin apprentice vm setup` makes apprentice-linkedin,
# and an agent session started with APPRENTICE_VM=linkedin works only there (`apprentice --vm linkedin
# <command>` for one command). Its section overrides [vm]; name, host and port are never inherited.
# [vm.linkedin]
# memory_mb = 2048

[update]
# apprentice checks its upstream every check_hours and updates itself: it rebases your local commits,
# rebuilds, runs its self-test and restarts between commands. A failed build or test keeps the old
# version. Set auto = false to only be told (`session` prints it) and run `apprentice update` yourself.
auto = true
check_hours = 6

# What the clone keeps of each session in sessions/, committed when the session ends, so what was
# learned outlives the 30-day log and can travel in `apprentice pr`. "scrubbed" keeps commands, diffs,
# timings, errors (quoted text removed), hosts, the model and the task; "full" also keeps URLs and
# element names; "off" keeps nothing. Never typed text or screenshots.
[storage]
sessions = "scrubbed"
