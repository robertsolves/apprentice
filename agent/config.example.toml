# ~/.apprentice/config.toml

# Keystrokes keep a slight human rhythm. The cursor and the pause between actions do not wait;
# raise move_ms (e.g. [200, 900]) and between_actions_ms (e.g. [500, 2000]) for a site that needs it.
[pace.default]
move_ms = [50, 200]
key_ms_median = 100
key_ms_sigma = 0.4
between_actions_ms = [0, 0]
nav_min_gap_s = 5
reload_max = { count = 3, window_s = 120 }
actions_per_min = 30

# Every profile starts from pace.default; list only the keys that differ.
[pace."github.com"]
# actions_per_min = 20

# Social sites: a person's pace. Reads a page before acting on it (dwell_s), rests after a few quick
# actions (burst, rest_s), and moves and types at hand speed. Budgets per action kind are in budgets.json.
# A profile covers its subdomains too (www.linkedin.com).
[pace."linkedin.com"]
move_ms = [200, 900]
between_actions_ms = [3000, 12000]
dwell_s = [3, 8]
burst = [4, 6]
rest_s = [20, 90]
actions_per_min = 6
key_error_rate = 0.015

[pace."x.com"]
move_ms = [200, 900]
between_actions_ms = [2000, 8000]
dwell_s = [2, 6]
burst = [4, 6]
rest_s = [20, 90]
actions_per_min = 8
key_error_rate = 0.015

[pace."reddit.com"]
move_ms = [200, 900]
between_actions_ms = [2000, 8000]
dwell_s = [2, 6]
burst = [4, 6]
rest_s = [20, 90]
actions_per_min = 8
key_error_rate = 0.015

[pace.native]
mode = "fast"   # shorter key gaps in native apps

# Text that means a site is throttling the account (seen after an action: the site cools down for
# 1 h, then 6 h, then 24 h) and signs of a check only the user may complete. These replace the
# built-in lists; matched lower case, no commas inside a phrase.
[sites]
# soft_block = ["try again later", "temporarily restricted", "unusual activity", "rate limit"]
# challenge = ["captcha", "verify you are human", "confirm it's you", "enter the code"]

[session]
# Empty means unrestricted. Example: allow = ["github.com", "example.com"]
allow = []

[agent]
# false: the LLM may use quick shell commands for macOS tasks (files, folders, opening apps).
# true: everything goes through the UI. Websites always go through the UI.
# APPRENTICE_UI_ONLY=1 sets it for one shell.
ui_only = false
# The first `session` after apprentice starts opens a little window asking for these options.
ask_on_start = true
# Sound when apprentice's little window pops up: a system sound name (Ping, Glass, Pop…) or "none".
ask_sound = "Ping"
# Keep the display and system from idle sleep and locking while a task runs, and 2 min after (`apprentice awake on|off`).
keep_awake = false
# Where questions go. "both": the little window first, and if nobody answers within ask_window_s the
# agent asks in the chat (terminal), so the user can answer remotely. "window" or "terminal" for one only.
# `apprentice away on` switches to the terminal until `apprentice away off`.
ask_in = "both"
ask_window_s = 60
# Apps that open https links count as browsers. Add bundle ids here for any that do not register.
# browsers = ["com.example.Browser"]
# Context-menu items `download` uses, matched lower case. Add your language's if the Mac is not in English.
# download_menu = ["save image as", "download linked file", "save link as", "download image"]

[run]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key = ""
vision_model = ""

# A separate Mac in a VM (Tart) that runs the browser, so browser work never borrows your cursor
# and keyboard. `apprentice vm setup` makes it; `apprentice vm on` sends browser sessions there.
# [vm]
# name = "apprentice-browser"
# browser = "Safari"
# cpu = 4
# memory_mb = 4096
# home = "/Volumes/SSD/tart"   # keep the VM (about 35 GB) on another disk

[update]
# apprentice checks its upstream every check_hours and updates itself: it rebases your local commits,
# rebuilds, runs its self-test and restarts between commands. A failed build or test keeps the old
# version. Set auto = false to only be told (`session` prints it) and run `apprentice update` yourself.
auto = true
check_hours = 6
