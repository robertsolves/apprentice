# The window's own words: the sidebar's sections in the order shown, each with its name and icon (an SF
# Symbol), and the explainer that says what the screen is for. apprentice reads this file, then
# ~/.apprentice/app-text.toml, where a section's keys replace these one by one. The Sites screen's words
# are in site-settings.toml.

[section.projects]
label = "Projects"
icon = "folder.fill"
explainer_title = "What is a project?"
about = "A project is one piece of work, like running a shop's Instagram or sending the weekly invoices. Everything starts in one: its terminal, its VM, its pipelines, its schedules and its skills. It is a folder on this Mac, so any agent you open in it knows what the project is and which VM to use."
points = [
    "Choose a project on the left. Work shows its terminal, with its VM's screen beside it.",
    "A project's work runs as pipelines. On Work: open your agent in the tab, choose a pipeline or type a task, and press Run. Your agent directs the run while the steps work in the background.",
    "Projects on their own VMs work at the same time. This Mac and each VM take one agent at a time.",
    "Save keeps a version. Save to GitHub puts it online, private, so you can open it on another Mac.",
    "In a terminal: apprentice project list, new, open and save.",
]

[section.terminal]
label = "Terminal"
icon = "terminal.fill"
explainer_title = "What is the terminal?"
about = "A terminal is where work shows. A pipeline runs in a tab of its own, and any other tab is a shell in this project's folder and its VM. Type to it like a chat, and answer its questions with the arrow keys and Return."
points = [
    "The box at the top runs a simple task: it is saved as a pipeline of one step and runs in a new tab.",
    "The blue + opens another shell. The list icon beside it edits this project's commands, one button each.",
    "Tabs keep running when you look at another project.",
    "⌘T opens a shell. ⌘1 to ⌘9 choose a project.",
]

[section.pipelines]
label = "Pipelines"
icon = "list.number"
explainer_title = "What is a pipeline?"
about = "A pipeline is how a project gets work done: steps that run one after another, each given to an agent you choose, and each told what the steps before it found. It can branch, and steps can run at the same time and talk to each other. A pipeline with one step is a simple task."
points = [
    "For example: 1. Get the new comments on my Instagram post. 2. Answer the ones that ask about prices by email. 3. Write me a two-line summary.",
    "Run takes you to Work, where you can add a first and last step for that run only. Or put it on a schedule: every morning, every Monday.",
    "If an agent runs out of tokens or stalls, the next one on your list takes over. If it needs you, the run waits here with your choices.",
    "Audit writes a brief for reviewing the pipeline, and opens a shell where any agent can help you tweak it.",
    "Each pipeline is a file in its project's pipelines folder. In a terminal: apprentice pipeline task, list, run and new.",
]

[section.instructions]
label = "Instructions"
icon = "doc.text"
explainer_title = "What agents read"
about = "Any agent opened in this project reads AGENTS.md first. It holds your notes on the project, and a short part apprentice keeps up to date on how pipelines work. Skills and commands are copied to where each agent looks for them."
points = [
    "Edit your own part here. Apprentice only ever changes the tinted part, and asks before replacing a change you made to it.",
    "Files made by apprentice are read-only here. Edit the original, in this project's .apprentice folder.",
]

[section.schedules]
label = "Schedules"
icon = "calendar"
explainer_title = "What is a schedule?"
about = "A schedule runs something later, or again and again: a simple task or a pipeline. In a project, a task or a command is saved as a pipeline of one step. It asks for the same approvals as anything you start yourself."
points = [
    "It runs while this Mac is on and awake, even with this window closed.",
    "A run missed while the Mac slept is skipped, not repeated in a burst.",
    "To run with nobody at the Mac, keep it plugged in and turn on Keep the Mac awake in Settings.",
]

[section.skills]
label = "Skills"
icon = "book.closed.fill"
explainer_title = "What is a skill?"
about = "A skill is what an agent knows before it acts: how a website or an app works, the steps for a task, how a person behaves on a site, or a rule for everything. Agents find the right ones by themselves."
points = [
    "Yours: written by you. Agents follow them.",
    "Learned by apprentice: written by apprentice as it works, so the next run is faster. Agents treat them as hints, and you can edit or forget any of them.",
    "Built in: come with apprentice. To change one, make your own copy; yours is used instead.",
    "Keep names, handles and anything personal out. For those, apprentice keeps your preferences separately.",
]

[section.sites]
label = "Sites"
icon = "globe"

[section.vms]
label = "VMs"
icon = "server.rack"
explainer_title = "What is a VM?"
about = "A VM is a small Linux computer that runs inside this Mac. It has its own screen, mouse and keyboard, so an agent can use websites there while you keep using your Mac."
points = [
    "Make one per project to keep each project's accounts apart.",
    "Choose a running VM to watch its screen here, live, with its pointer. Look at its screen to click or type in it.",
    "A VM only runs while this Mac is on and awake.",
]

[section.settings]
label = "Settings"
icon = "gearshape.fill"
explainer_title = "What are settings?"
about = "How apprentice behaves while it works: sounds, notifications, keeping the Mac awake, how this window looks. Each change is saved the moment you make it."
points = [
    "A project or a VM can have its own. Whatever it leaves alone comes from the level above: a project from its VM, a VM from this Mac.",
    "Everything else is in the settings file, for when someone technical needs it.",
]

[section.updates]
label = "Updates"
icon = "arrow.down.circle.fill"
explainer_title = "What is here?"
about = "The version you have, whether a newer one is out, the permissions apprentice needs from macOS, and the agents it is connected to."

[learning]
nudge = "learned? {tries} tries and {seconds} s on {place} before this worked. If you found something about the place that holds for any task, keep it once: apprentice learn --fact \"trap … | hidden … | works … | layout …\""
closing = "{count} {things} you worked out on {place}, nothing kept: learn --fact?"
