# Text a site shows when it throttles the account; seeing one after an action cools the site down
# (BOT_DETECTION D1). Signs of a CAPTCHA or identity check, which only the user may complete, and the
# addresses those checks live at.

[phrases]
soft_block = [
    "try again later", "you're doing that too much", "you are doing that too much", "temporarily restricted",
    "temporarily blocked", "unusual activity", "we limit how often", "rate limit", "too many requests",
    "action blocked", "suspicious activity", "temporarily limited", "over the daily limit", "später erneut",
    "vorübergehend gesperrt", "vorübergehend eingeschränkt", "ungewöhnliche aktivität", "zu viele anfragen",
    "réessayer plus tard", "réessayez plus tard", "temporairement bloqué", "temporairement restreint",
    "activité inhabituelle", "trop de requêtes", "inténtalo más tarde", "vuelve a intentarlo más tarde",
    "bloqueado temporalmente", "restringido temporalmente", "actividad inusual", "demasiadas solicitudes",
    "tente novamente mais tarde", "bloqueado temporariamente", "atividade incomum", "riprova più tardi",
    "temporaneamente bloccato", "attività insolita", "probeer het later opnieuw", "tijdelijk geblokkeerd",
    "spróbuj ponownie później", "tymczasowo zablokowane", "daha sonra tekrar dene", "geçici olarak engellendi",
    "повторите попытку позже", "временно заблокирован", "необычная активность", "しばらくしてから", "一時的にブロック", "制限されています",
    "잠시 후 다시", "일시적으로 차단", "稍后再试", "請稍後再試", "暂时被限制", "操作过于频繁",
]
challenge = [
    "captcha", "verify you are human", "verify you're human", "i'm not a robot", "i am not a robot",
    "are you a robot", "confirm it's you", "confirm it is you", "enter the code", "security check", "press and hold",
    "help us confirm", "your account has been locked", "your account is locked",
    "bestätige, dass du ein mensch bist", "sicherheitsüberprüfung", "je ne suis pas un robot",
    "vérifiez que vous êtes humain", "confirmez qu'il s'agit bien de vous", "no soy un robot",
    "verifica que eres humano", "confirma que eres tú", "não sou um robô", "confirme que é você",
    "non sono un robot", "conferma che sei tu", "ik ben geen robot", "nie jestem robotem", "robot değilim",
    "я не робот", "подтвердите, что это вы", "ロボットではありません", "本人確認", "로봇이 아닙니다", "본인 인증", "我不是机器人", "安全验证", "验证身份",
]
challenge_paths = [
    "/challenge", "/checkpoint", "/captcha", "/sorry/", "/account/access", "/verify", "/authwall",
]

# Words and phrases that make a step one only the user can approve. [gate] user_only in config.toml
# replaces this list.

[gate]
# Controls in apprentice's own window that give something away (the buttons on a pending approval, a run's questions
# about access, a script that is about to run). The window can be driven like any app, and these stay the user's.
# Matched as whole words in a control's name, as user_only is. [gate] own_window_user_only in your sites.toml adds to it.
own_window_user_only = [
    "allow", "deny", "run it", "install", "uninstall", "use the edited file", "sign in with github", "sign out",
    "save schedule", "run now", "start at login", "stop starting at login",
]
# The processes macOS shows its own dialogs from: a password, a permission, a warning about an app. Only the user answers
# them, so nothing is clicked while one covers the target, and none is ever the app to give the screen back to.
system_dialogs = ["SecurityAgent", "UserNotificationCenter", "CoreServicesUIAgent", "universalAccessAuthWarn", "coreautha"]
user_only = [
    "pay", "pay now", "buy", "buy now", "purchase", "checkout", "check out", "place order", "order now", "donate",
    "transfer", "upgrade", "captcha", "not a robot", "verify you are human", "delete account", "close account",
    "deactivate",
]
