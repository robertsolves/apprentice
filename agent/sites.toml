# What apprentice knows about websites: which are social networks, which words on a control are a like,
# a follow or a post, and the words a site uses when it slows an account down or puts up a check.
# apprentice reads this file, then ~/.apprentice/sites.toml, which adds to it: a site, a word or a phrase
# there is added, never taken away. config.toml's [sites] soft_block_extra, challenge_extra and
# [sites.kinds] add more per install, and [sites] soft_block and challenge replace those two lists.


# Social networks start at the careful style (BOT_DETECTION S1) and never go below steady, because a
# social site's pace is the account's standing. Old names count as the new one (`renamed`).

[social]
sites = [
    "facebook.com", "instagram.com", "threads.net", "threads.com", "tiktok.com", "linkedin.com", "x.com",
    "reddit.com", "pinterest.com", "youtube.com", "bsky.app",
]

[renamed]
"twitter.com" = "x.com"

# The kinds budgets.json caps, tested in this order, so "unfollow" wins over "follow" and "add friend"
# over "add". Whole words only: "Unlike" and "Following" are not a like or a follow. Chinese, Japanese and
# Korean words match inside the text. `counts_as`: a kind with no cap of its own counts against this one.

[kind.unfollow]
words = [
    "unfollow", "nicht mehr folgen", "entfolgen", "ne plus suivre", "se désabonner", "dejar de seguir",
    "deixar de seguir", "smetti di seguire", "ontvolgen", "przestań obserwować", "takibi bırak", "отписаться",
