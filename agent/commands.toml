summary = "What agents know: built in, learned, yours and the project's. Words search them through an index; a name prints that skill."
output = "Matching skills and their lines."
where = "Mac, VM, pipeline steps"
changes = "only forget, share and library"
example = "apprentice skills \"new folder\""
example_output = "macos/finder.md · Finder · built in
  - …"
mcp = "Search the learned app, site and flow playbooks"
flags = ["--paths: where each kind lives", "--check: look for anything personal", "--reindex: rebuild the word index from a walk", "--all: with words, also the retired facts", "share --library: show the confirmed facts that would go to the public library; --yes opens the pull request; --place path, one place only; --not-now, ask again in 30 days", "library: whether a library is set, and what is ready to share. fetch, its index now. init <folder>, a new library's repo. merge <folder> --from <offers> --by <login> and publish <folder> --out <folder> are what its CI runs"]
exits = ["5: nothing to forget or share under that path"]
aliases = ["playbooks", "notes"]

