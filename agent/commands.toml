[command."do"]
group = "Acting on the screen (real cursor and keys; each proposes first)"
usage = "do <flow> [--key value …] | do --explain \"task\""
summary = "Runs a skill's saved steps with one approval; --explain says which flow a task would pick, and runs nothing."
output = "Each step's result, and the screen at the first step that fails."
where = "Mac, VM; a step with the screen"
changes = "the screen"
example = "apprentice do --explain \"new folder in Finder\""
example_output = "flows for … · → 8 · new-folder"
mcp = "Run a flow from playbooks/flows with one approval. vars: {\"name\": \"value\"} fills {name}. explain: a task in words, to see which flow would be picked and its score, without running anything"
flags = ["--key value: fills {key} in the flow", "--explain \"task\": show the pick and its score"]
exits = ["2: stale: read, then decide again", "4: rate limit, budget, cooldown, challenge or another agent", "5: not found", "6: interrupted by the user or the kill switch", "8: approve the token to act"]
screen = true
approval = true

[command."approve"]
group = "Approvals and the user"
usage = "approve <token> [--text \"edited text\"]"
summary = "Runs a proposed action; --text replaces the text of a proposed type. Steps marked ⚠ are the user's: use confirm."
output = "The action's diff."
where = "Mac, VM"
changes = "the screen"
example = "apprentice approve a1b2"
example_output = "ok · snap 8 · +3 -0 ~1"
mcp = "Run a proposed action. Optional text replaces the text of a proposed type"
exits = ["3: the user denied it", "5: no such token"]
screen = true

[command."deny"]
group = "Approvals and the user"
usage = "deny <token>"
summary = "Drops a proposed action."
output = "What was dropped."
where = "Mac, VM"
changes = "the pending list"
example = "apprentice deny a1b2"
example_output = "denied a1b2"
mcp = "Drop a proposed action"

[command."pending"]
group = "Approvals and the user"
usage = "pending"
summary = "Lists the proposals waiting for approve or deny."
output = "One token and summary a line."
where = "Mac, VM"
example = "apprentice pending"
example_output = "a1b2 click button \"Send\""
mcp = "The proposals waiting for approve or deny, if any"

[command."confirm"]
group = "Approvals and the user"
usage = "confirm <token> [--why \"…\"]"
summary = "Shows the user a pending step with Approve and Deny, and runs it if they approve; for every ⚠ step."
output = "The action's diff."
where = "Mac only: the user's own approval never shows on a VM's screen"
changes = "the screen"
example = "apprentice confirm a1b2 --why \"sends the invoice\""
example_output = "approved · ok · snap 8"
mcp = "Show the user a pending step with Approve and Deny; runs it if they approve. Use for ⚠ steps"
exits = ["3: the user denied it", "9: they did not answer: ask in the chat"]

[command."ask"]
group = "Approvals and the user"
usage = "ask \"question\" [--choices \"A|B|C\" [--multi] [--text]] [--timeout 600] | ask --optional \"question\" --choices \"A|B\" [--multi] [--assume A]"
summary = "Opens a little window for the user and prints their reply; for any decision that is theirs. Inside a pipeline step the window names you and the step, and exit 9 means save your progress and exit: the answer restarts the step."
output = "`user chose: …` and/or `user: …`."
where = "Mac, VM, pipeline steps"
changes = "nothing"
example = "apprentice ask \"Which account?\" --choices \"Work|Personal\""
example_output = "user chose: Work"
mcp = "When stuck or deciding, show the user a little window: free text, or choices (multi for checkboxes, text to add a reply field). Returns their reply. optional: a question they may leave (choices only); after a minute it returns 'carry on assuming <assume>'. Prefer choices, and optional for preferences"
flags = ["--choices \"A|B\": radio buttons, or checkboxes with --multi", "--text: add a reply field beside the choices", "--timeout S: how long the window stays", "--optional: never takes focus; carries on with --assume after a minute"]
exits = ["5: skipped, or timed out with [agent] ask_in = window", "9: they did not answer in time: ask in the chat, or inside a pipeline step save your progress and exit"]

[command."show"]
group = "Approvals and the user"
usage = "show \"what\""
summary = "Asks the user to point the cursor at something, and prints the element there."
output = "The element under the pointer."
where = "Mac, VM"
example = "apprentice show \"the export button\""
example_output = "18 button \"Export\""
mcp = "Ask the user to point at something on screen; returns the element there"
exits = ["9: they are away: ask them to describe it"]

[command."resume"]
not_in_step = ["*"]
group = "Approvals and the user"
usage = "resume"
summary = "Lifts the kill switch's stop; only when the user has said to carry on."
output = "A line saying so."
where = "Mac, VM"
changes = "the kill switch"
example = "apprentice resume"
example_output = "resumed"
mcp = "Lift the kill switch's stop, only when the user has said to carry on"

[command."away"]
not_in_step = ["on", "off"]
group = "Approvals and the user"
usage = "away on|off|status|wait|add|list|cancel"
summary = "Says the user is away or back, and runs queued work only while they are away; questions go to the chat while away."
output = "The state."
where = "Mac, VM"
changes = "where questions go"
example = "apprentice away on"
example_output = "away: on"
mcp = "The user is away (on), back (off), wait: run only when they are away; questions go to the chat while away"
exits = ["10: the user came back, nothing was done: wait with away wait"]

[command."phone"]
not_in_step = ["on", "off"]
group = "Approvals and the user"
usage = "phone [on|off|test]"
summary = "One-tap phone setup: questions that go to the chat buzz the phone."
output = "A QR code and links."
where = "Mac"
changes = "[agent] notify"
example = "apprentice phone test"
example_output = "sent a test push"
mcp = "Set up push notifications to the user's phone (on), stop them (off) or send a test; returns links to tap"

[command."pref"]
