summary = "How the steps of a run talk, the same for every agent: post, read what is new, wait for an answer. summarise rewrites the rolling summary with the scribe."
output = "Messages, one a line, or `posted`."
where = "Pipeline steps; show and summarise anywhere"
tokens = "summarise only"
changes = "the run's board"
example = "apprentice board post --to docs \"The API now returns 404\""
example_output = "posted to docs"
flags = ["--to STEP: one step instead of everyone", "--urgent: with --to, stop that step and start it again with this message, wasting what it has not finished. Not a step that already acted on the screen; another step can do it [pipelines] urgent_max times (2) per step in a run, the user any time", "--for 10m: how long a wait lasts (default 10 minutes)", "--run N: from outside a step, post to this run", "--all: everything so far, not only what is new"]
exits = ["5: wait timed out or the other step ended; or the message is too long; carry on another way", "7: this step's sandbox stops writes: put it in what you print"]
slash = ["board:read"]

