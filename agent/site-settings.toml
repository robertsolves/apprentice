[field.follow]
group = "caps"
store = "budget"
type = "cap"
key = "follow"
label = "Follows"

[field.unfollow]
group = "caps"
store = "budget"
type = "cap"
key = "unfollow"
label = "Unfollows"

[field.connect]
group = "caps"
store = "budget"
type = "cap"
key = "connect"
label = "Invitations to connect"
only = ["linkedin.com"]

[field.friend_request]
group = "caps"
store = "budget"
type = "cap"
key = "friend_request"
label = "Friend requests"
only = ["facebook.com"]

[field.join]
group = "caps"
store = "budget"
type = "cap"
key = "join"
label = "Joining groups or communities"
only = ["reddit.com", "facebook.com"]

[field.message]
group = "caps"
store = "budget"
type = "cap"
key = "message"
label = "Messages"

